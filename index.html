<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>体育场馆预订系统</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="phone-shell" aria-label="体育场馆预订系统消息界面">
    <section class="chat-screen">
      <div class="status-bar" aria-hidden="true">
        <div class="status-time">18:24</div>
        <div class="status-icons">
          <span class="signal">
            <i></i><i></i><i></i><i></i>
          </span>
          <span class="wifi"></span>
          <span class="battery"><span>32</span><b></b></span>
        </div>
      </div>

      <header class="chat-header">
        <div class="header-left" aria-hidden="true">
          <span class="back-icon"></span>
          <span class="unread-badge">24</span>
        </div>
        <h1>体育场馆预订系统</h1>
        <button class="more-button" type="button" aria-label="更多">•••</button>
      </header>

      <div class="message-area">
        <div class="watermark" aria-hidden="true">
          <span>邢雯桃@中山大学</span>
          <span>邢雯桃@中山大学</span>
          <span>邢雯桃@中山大学</span>
          <span>邢雯桃@中山大学</span>
          <span>邢雯桃@中山大学</span>
          <span>邢雯桃@中山大学</span>
        </div>

        <div class="message-time">12:50</div>

        <div class="cards" id="messageCards" aria-live="polite"></div>
      </div>

      <footer class="compose-bar" aria-hidden="true">
        <button class="voice-button" type="button" aria-label="语音"></button>
        <div class="input-placeholder">发消息或按住...</div>
        <button class="emoji-button" type="button" aria-label="表情"></button>
        <button class="plus-button" type="button" aria-label="添加"></button>
      </footer>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="message-card">
      <h2>您的预约已确认</h2>
      <p>
        您好！您已成功预定场地。
        <span class="nowrap">场地名称：</span>
        <span class="venue"></span>，
        <span class="nowrap">预定时间：</span>
        <span class="reservation-time"></span>
      </p>
      <div class="detail-row">
        <span>详情</span>
        <span class="chevron"></span>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
